# Glass Matcap Configuration
# High-res with alpha for transparent materials

tone_mapping: aces
exposure: 1.0
gamma: 2.2
output_size: 2048
quality: 95
matcap_mode: true
crop_method: center
resample_method: lanczos
ensure_power_of_2: true
preserve_alpha: true
sharpen: 0.05
saturation: 0.95
brightness: 1.0
contrast: 1.0
recursive: false
overwrite: false
workers: 4
